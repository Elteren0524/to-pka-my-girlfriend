<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Valentine?</title>

  <!-- Sci-fi font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    :root{
      --bg1:#020617;
      --bg2:#071a38;

      --panel:#0b2343;
      --ink:#eaf6ff;

      --neon:#39b7ff;
      --neon2:#7a86ff;

      --line: rgba(57,183,255,.55);
      --lineSoft: rgba(57,183,255,.18);
    }

    body{
      margin:0;
      min-height:100vh;
      background: radial-gradient(1200px 700px at 30% 20%, rgba(57,183,255,.12), transparent 60%),
                  radial-gradient(900px 600px at 80% 30%, rgba(122,134,255,.10), transparent 62%),
                  linear-gradient(var(--bg1), var(--bg2));
      font-family: Orbitron, Arial, sans-serif;
      color:var(--ink);
      overflow:hidden;
    }

    .wrap{
      position:fixed;
      inset:0;
      display:grid;
      place-items:center;
      padding: 18px;
    }

    .card{
      position:relative;
      width:min(980px, 92vw);
      height:min(560px, 82vh);
      border-radius:28px;
      background:
        radial-gradient(1000px 500px at 40% 20%, rgba(57,183,255,.08), transparent 70%),
        radial-gradient(800px 500px at 70% 80%, rgba(122,134,255,.07), transparent 70%),
        linear-gradient(180deg, rgba(8,28,55,.95), rgba(6,22,45,.95));
      box-shadow: 0 0 90px rgba(0,0,0,.65);
      overflow:hidden;
      isolation:isolate;
    }


    .card::before{
      content:"";
      position:absolute;
      inset:10px;
      border-radius:22px;
      border:1px solid var(--line);
      box-shadow:
        0 0 10px rgba(57,183,255,.35),
        0 0 25px rgba(57,183,255,.25),
        0 0 60px rgba(57,183,255,.15);
      pointer-events:none;
      z-index:1;
    }
    .card::after{
      content:"";
      position:absolute;
      inset:0;
      border-radius:28px;
      border:1px solid rgba(255,255,255,.06);
      pointer-events:none;
      z-index:1;
    }


    #confetti{
      position:absolute;
      inset:0;
      z-index:6;
      pointer-events:none;
    }

    .content{
      position:relative;
      z-index:3;
      height:100%;
      padding:64px 72px;
      text-align:center;
    }

    #title{
      margin:0;
      font-size:clamp(30px, 4.2vw, 56px);
      font-weight:800;
      letter-spacing:.6px;
      text-shadow:0 0 18px rgba(57,183,255,.18);
      line-height:1.18;
    }

    .hint{
      margin:16px 0 0;
      opacity:.9;
      font-size:14px;
      letter-spacing:1.2px;
      text-transform:uppercase;
    }


    .playground{
      position:relative;
      width:100%;
      height:240px;
      margin-top:26px;
    }

    .btn{
      width:150px;
      height:54px;
      border:none;
      border-radius:999px;
      font-size:16px;
      color:#fff;
      cursor:pointer;
      user-select:none;
      position:absolute;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family: Orbitron, Arial, sans-serif;
      letter-spacing:.6px;
    }

    .yes{
      background: linear-gradient(180deg, #3bb4ff, #1f7cff);
      box-shadow: 0 0 18px rgba(57,183,255,.25);
    }

    .no{
      background:linear-gradient(90deg,#a855f7,#9333ea);
      will-change:left, top;
      box-shadow: 0 0 18px rgba(168,85,247,.18);
    }

    .bubble{
      position:absolute;
      z-index:7;
      padding:6px 10px;
      border-radius:999px;
      font-size:11px;
      background:rgba(255,255,255,.12);
      border:1px solid rgba(255,255,255,.18);
      backdrop-filter: blur(6px);
      opacity:0;
      transform:translateY(6px) scale(.98);
      pointer-events:none;
      transition:opacity .15s ease, transform .15s ease;
      white-space:nowrap;
    }
    .bubble.show{
      opacity:1;
      transform:translateY(0) scale(1);
    }


    .resultWrap{
      display:none;
      margin-top:18px;
      width:100%;
      text-align:center;
    }

    .resultText{
      display:block;
      width:100%;
      font-weight:900;
      font-size:clamp(52px, 8vw, 110px);
      letter-spacing:2px;
      margin-top:8px;
      text-align:center;
      text-shadow:0 0 22px rgba(130,220,255,.55),
                  0 0 46px rgba(130,220,255,.42);
      animation: glowPulse 1.2s infinite;
    }

    .subText{
      display:block;
      width:100%;
      margin-top:10px;
      font-size:14px;
      letter-spacing:1.2px;
      text-transform:uppercase;
      opacity:.95;
      text-align:center;
    }

    @keyframes glowPulse{
      0%{
        transform:scale(1);
        text-shadow:0 0 20px rgba(130,220,255,.55),
                    0 0 40px rgba(130,220,255,.40);
      }
      50%{
        transform:scale(1.06);
        text-shadow:0 0 36px rgba(160,235,255,.70),
                    0 0 80px rgba(160,235,255,.55);
      }
      100%{
        transform:scale(1);
        text-shadow:0 0 20px rgba(130,220,255,.55),
                    0 0 40px rgba(130,220,255,.40);
      }
    }


    @media (max-width: 520px){
      .content{ padding:44px 26px; }
      .playground{ height:220px; margin-top:18px; }
      .btn{ width:148px; height:52px; font-size:15px; }
      .hint{ font-size:13px; }
      .subText{ font-size:13px; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card" id="card">
      <canvas id="confetti"></canvas>

      <div class="content" id="content">
        <h1 id="title">Pka, will you be my Girlfriend?</h1>
        <p id="hint" class="hint">Choose wisely...</p>

        <div id="playground" class="playground">
          <button id="yes" class="btn yes" type="button">Yes</button>
          <button id="no" class="btn no" type="button">No</button>
          <div id="bubble" class="bubble" aria-hidden="true"></div>
        </div>

        <div id="resultWrap" class="resultWrap">
          <div id="result" class="resultText">YAYYYY!!</div>
          <div id="sub" class="subText">I knew you'd say yes 💖</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const card = document.getElementById("card");
    const playground = document.getElementById("playground");
    const yes = document.getElementById("yes");
    const no = document.getElementById("no");
    const hint = document.getElementById("hint");
    const resultWrap = document.getElementById("resultWrap");
    const bubble = document.getElementById("bubble");

    const GAP = 70;

    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }


    function setInitialPositions() {
      const w = playground.clientWidth;
      const h = playground.clientHeight;

      const btnW = yes.offsetWidth;
      const btnH = yes.offsetHeight;

      const pad = 12;
      const centerX = w / 2;

      const needStack = w < (btnW * 2 + GAP + pad * 2);

      if (needStack) {
        // vertical stack (Yes 上, No 下)
        const x = clamp(centerX - btnW/2, pad, w - btnW - pad);
        const y1 = clamp(h/2 - btnH - 10, pad, h - btnH - pad);
        const y2 = clamp(h/2 + 10,        pad, h - btnH - pad);

        yes.style.left = `${x}px`;
        yes.style.top  = `${y1}px`;

        no.style.left  = `${x}px`;
        no.style.top   = `${y2}px`;
      } else {
        // horizontal
        const y = clamp((h/2) - (btnH/2), pad, h - btnH - pad);
        const yesX = centerX - (GAP/2) - btnW;
        const noX  = centerX + (GAP/2);

        yes.style.left = `${clamp(yesX, pad, w - btnW - pad)}px`;
        yes.style.top  = `${y}px`;

        no.style.left  = `${clamp(noX,  pad, w - btnW - pad)}px`;
        no.style.top   = `${y}px`;
      }
    }


    window.addEventListener("load", () => requestAnimationFrame(setInitialPositions));

    const ro = new ResizeObserver(() => {
      setInitialPositions();
      resizeCanvas();
    });
    ro.observe(playground);
    ro.observe(card);

    function rectsOverlap(a, b) {
      return !(
        a.right  <= b.left  ||
        a.left   >= b.right ||
        a.bottom <= b.top   ||
        a.top    >= b.bottom
      );
    }

    const bubbleTexts = ["hehe","nice try","not happening","nope","try again","almost…","uh-uh"];
    let bubbleTimer = null;

    function showBubbleNearNo() {
      const msg = bubbleTexts[Math.floor(Math.random() * bubbleTexts.length)];
      bubble.textContent = msg;

      const pgW = playground.clientWidth;
      const pgH = playground.clientHeight;

      const noLeft = parseFloat(no.style.left || "0");
      const noTop  = parseFloat(no.style.top  || "0");


      bubble.classList.add("show");


      const bw = bubble.offsetWidth;
      const bh = bubble.offsetHeight;

      let bx = noLeft + no.offsetWidth - bw + 6; // 右上
      let by = noTop - bh - 10;


      if (by < 8) by = noTop + no.offsetHeight + 10;


      bx = clamp(bx, 8, pgW - bw - 8);
      by = clamp(by, 8, pgH - bh - 8);

      bubble.style.left = `${bx}px`;
      bubble.style.top  = `${by}px`;

      if (bubbleTimer) clearTimeout(bubbleTimer);
      bubbleTimer = setTimeout(() => bubble.classList.remove("show"), 650);
    }

    function moveNo() {
      const pad = 14;
      const safe = 22;

      const w = playground.clientWidth;
      const h = playground.clientHeight;
      const btnW = no.offsetWidth;
      const btnH = no.offsetHeight;

      const yesRectAbs = yes.getBoundingClientRect();
      const pgRectAbs = playground.getBoundingClientRect();

      const yesRect = {
        left:   (yesRectAbs.left - pgRectAbs.left) - safe,
        top:    (yesRectAbs.top  - pgRectAbs.top)  - safe,
        right:  (yesRectAbs.right- pgRectAbs.left) + safe,
        bottom: (yesRectAbs.bottom- pgRectAbs.top) + safe
      };

      const minX = pad;
      const maxX = w - btnW - pad;
      const minY = pad;
      const maxY = h - btnH - pad;

      let x = minX, y = minY;
      let tries = 0;

      while (tries < 120) {
        x = minX + Math.random() * Math.max(0, maxX - minX);
        y = minY + Math.random() * Math.max(0, maxY - minY);

        const noRect = { left:x, top:y, right:x+btnW, bottom:y+btnH };
        if (!rectsOverlap(noRect, yesRect)) break;
        tries++;
      }

      no.style.transition = "left 140ms ease-out, top 140ms ease-out";
      no.style.left = `${x}px`;
      no.style.top  = `${y}px`;

      showBubbleNearNo();
    }

    no.addEventListener("mouseenter", moveNo);
    no.addEventListener("click", moveNo);

    yes.addEventListener("click", () => {
      hint.style.display = "none";
      playground.style.display = "none";
      resultWrap.style.display = "block";
      startConfetti();
    });


    const canvas = document.getElementById("confetti");
    const ctx = canvas.getContext("2d");
    let pieces = [];
    let raf = null;

    function resizeCanvas() {
      canvas.width = card.clientWidth;
      canvas.height = card.clientHeight;
    }
    resizeCanvas();

    function startConfetti() {
      if (raf) cancelAnimationFrame(raf);
      resizeCanvas();

      pieces = [];
      const W = canvas.width;
      const H = canvas.height;

      for (let i = 0; i < 220; i++) {
        pieces.push({
          x: Math.random() * W,
          y: -Math.random() * (H * 0.8),
          size: Math.random() * 7 + 4,
          speed: Math.random() * 3.5 + 2,
          drift: Math.random() * 1.8 - 0.9,
          color: `hsl(${Math.random() * 360}, 100%, 60%)`
        });
      }
      animate();
    }

    function animate() {
      const W = canvas.width;
      const H = canvas.height;

      ctx.clearRect(0, 0, W, H);

      for (const p of pieces) {
        p.y += p.speed;
        p.x += p.drift;

        if (p.x < -20) p.x = W + 20;
        if (p.x > W + 20) p.x = -20;

        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
      }

      pieces = pieces.filter(p => p.y < H + 40);

      if (pieces.length) raf = requestAnimationFrame(animate);
      else ctx.clearRect(0, 0, W, H);
    }
  </script>
</body>
</html>
